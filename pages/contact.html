<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
</head>

<body>

<header>
    <h1>Contact Us</h1>
</header>

<main>

<section>

<h2>Get in Touch</h2>

<p>
Have a question or a recipe you'd like to share? We'd love to hear from you!
</p>

</section>

<section>

<h2>Submit Your Recipe</h2>

<form>

<fieldset>

<legend>Recipe Submission Form</legend>

<p>
<label for="name">Name:</label><br>
<input type="text" id="name" name="name">
</p>

<p>
<label for="email">Email:</label><br>
<input type="email" id="email" name="email">
</p>

<p>
<label for="recipe">Recipe Name:</label><br>
<input type="text" id="recipe" name="recipe">
</p>

<p>
<label for="ingredients">Ingredients:</label><br>
<textarea id="ingredients" name="ingredients" rows="5"></textarea>
</p>

<p>
<label for="steps">Cooking Steps:</label><br>
<textarea id="steps" name="steps" rows="8"></textarea>
</p>

<p>
<input type="submit" value="Submit Recipe">
</p>

</fieldset>

</form>

</section>

</main>

<footer>
<p>2026 Simply Savory</p>
</footer>

</body>
</html>
